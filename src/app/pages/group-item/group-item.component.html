<ion-header>
  <ion-toolbar class="topbar">
    <ion-searchbar
      [(ngModel)]="searchText"
      placeholder="Search items..."
      animated="true"
      showCancelButton="never"
      (ionInput)="onSearch($event)"
      style="--background: white; --border-radius: 6px; width: 230px"
    ></ion-searchbar>

    <ion-buttons slot="end">
      <ion-button fill="solid" color="danger" (click)="openBack()">
        Close
        <ion-icon slot="end" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Skeleton loading -->
  <ion-grid *ngIf="isLoading">
    <ion-row>
      <ion-col size="6" *ngFor="let i of [1, 2, 3, 4, 5, 6, 7, 8]">
        <ion-card class="item-card">
          <ion-skeleton-text
            animated
            style="width: 100%; height: 80px"
          ></ion-skeleton-text>
          <ion-card-content>
            <ion-skeleton-text animated style="width: 60%"></ion-skeleton-text>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Actual data -->
  <ion-grid *ngIf="!isLoading">
    <ion-row class="item-grid">
      <ion-col
        size="6"
        size-sm="4"
        size-md="3"
        size-lg="3"
        *ngFor="let item of selectedCatGroup"
      >
        <ion-card button class="item-card" (click)="openItemDialog(item)">
          <div class="card-content-wrapper">
            <div class="text-wrapper">
              {{ item?.groupName }}
            </div>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Bottom Buttons -->
  <ion-row class="ion-justify-content-between ion-padding-top">
    <ion-col size="4">
      <ion-button expand="block" color="medium" (click)="openBack()">
        Back
      </ion-button>
    </ion-col>

    <!-- <ion-col size="4">
      <ion-button expand="block" color="danger" (click)="openCancel()">
        Cancel
      </ion-button>
    </ion-col>

    <ion-col size="4">
      <ion-button expand="block" color="success" (click)="openItemDialog()">
        Next
      </ion-button>
    </ion-col> -->
  </ion-row>
</ion-content>
