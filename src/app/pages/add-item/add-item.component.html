<ion-header>
  <ion-toolbar class="topbar">
    <ion-title class="center-text">Amira Restaurant</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="danger" (click)="closeForm()">
        Close
        <ion-icon slot="end" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="top-toolbar">
    <div class="left-icon">
      <ion-icon name="menu-outline"></ion-icon>
    </div>
    <div class="right-buttons">
      <div class="icon-button red">
        <ion-icon name="home-outline"></ion-icon>
      </div>
      <div class="icon-button green">
        <ion-icon name="grid-outline"></ion-icon>
      </div>
      <div class="icon-button yellow">
        <ion-icon name="restaurant-outline"></ion-icon>
      </div>
      <div class="icon-button purple">
        <ion-icon name="search-outline"></ion-icon>
      </div>
    </div>
  </div>

  <ion-item>
    <ion-label
      ><strong>{{ itemStore.name }}</strong></ion-label
    >
    <ion-label position="end">PAX:</ion-label>
    <ion-select interface="popover" [(ngModel)]="pax" placeholder="1">
      <ion-select-option *ngFor="let num of [1, 2, 3, 4, 5, 6]" [value]="num">{{
        num
        }}</ion-select-option>
    </ion-select>
  </ion-item>

  <ion-card>
    <ion-card-header>
      <ion-toolbar color="light">
        <ion-title>Order List</ion-title>
        <ion-buttons slot="end">
          <ion-button color="primary" fill="solid">
            <ion-icon name="add-circle" slot="start"></ion-icon>
            Add Item
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-card-header>

    <ion-card-content>
      <div class="responsive-wrapper">
  <ion-grid class="order-table">

     <ion-row class="table-header ion-align-items-center">
      <ion-col size="1" class="ion-text-center">
        <strong>Select</strong>
      </ion-col>
      <ion-col size="5">
        <strong>Item Name</strong>
      </ion-col>
      <ion-col size="2" class="ion-text-center">
        <strong>Qty</strong>
      </ion-col>
      <ion-col size="2" class="ion-text-center">
        <strong>Price </strong>
      </ion-col>
      <ion-col size="2" class="ion-text-center header-with-icon">
        <ion-button fill="clear" size="small" class="ellipsis-btn">
          <ion-icon name="ellipsis-vertical"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>

     <ion-row *ngFor="let item of orderList" class="table-row ion-align-items-center">
      <ion-col size="1" class="ion-text-center">
        <ion-checkbox [(ngModel)]="item.selected" (ionChange)="onSelectionChange()"></ion-checkbox>
      </ion-col>

      <ion-col size="5">
        <div class="item-name">{{ item?.itemName }}</div>
      </ion-col>

      <ion-col size="2" class="ion-text-center">
        <div class="quantity-container">
          <ion-button class="qty-btn minus" (click)="decreaseQty(item)">
            <ion-icon name="remove" slot="icon-only"></ion-icon>
          </ion-button>

          <div class="qty-label">{{ item.qty }}</div>

          <ion-button class="qty-btn plus" (click)="increaseQty(item)">
            <ion-icon name="add" slot="icon-only"></ion-icon>
          </ion-button>
        </div>
      </ion-col>

      <ion-col size="2" class="ion-text-center">
       {{ item.total | number: '1.2-2' }}
      </ion-col>

       <ion-col size="2" class="ion-text-center header-with-icon">
        <ion-button fill="clear" size="small" class="ellipsis-btn" (click)="openMenu()">
          <ion-icon name="ellipsis-vertical"></ion-icon>
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</div>

      <!-- Delete button only shows when any checkbox is checked -->
      <div *ngIf="anyItemSelected" class="ion-text-center">
        <ion-button color="danger" (click)="deleteSelected()">
          <ion-icon name="trash-outline" slot="start"></ion-icon>
          Delete Selected
        </ion-button>
      </div>
    </ion-card-content>

    <ion-footer>
      <ion-toolbar>
        <!-- Left side buttons -->
        <ion-buttons slot="start">
          <ion-button color="danger" fill="solid" (click)="closeForm()">
            <ion-icon name="arrow-back" slot="start"></ion-icon>
            Back
          </ion-button>

          <!-- <ion-button color="success" fill="solid" (click)="nextSelect()">
            Next
            <ion-icon name="arrow-forward" slot="end"></ion-icon>
          </ion-button> -->

          <!-- <ion-button color="primary" fill="solid" (click)="orderlistForm()">
            OK
          </ion-button> -->
        </ion-buttons>

        <!-- Right side button -->
        <ion-buttons slot="end">
          <ion-button color="success" fill="solid" (click)="order()">
            <ion-icon name="arrow-down" slot="start"></ion-icon>
            Order
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-footer>
  </ion-card>
</ion-content>
