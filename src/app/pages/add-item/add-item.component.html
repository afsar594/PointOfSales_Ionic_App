<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Add Item</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="danger" (click)="closeForm()">
        Close
        <ion-icon slot="end" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-card-content class="ion-padding">
  <ion-item>
    <ion-input
      type="text"
      label="Item"
      labelPlacement="floating"
      [readonly]="true"
      [value]="tableData?.itemName"
    ></ion-input>
  </ion-item>
  <ion-item>
    <ion-label>Quantity</ion-label>
    <div class="quantity-container">
      <ion-button class="qty-btn minus" (click)="decreaseQty()">
        <ion-icon name="remove" slot="icon-only"></ion-icon>
      </ion-button>

      <div class="qty-label">{{ quantity }}</div>

      <ion-button class="qty-btn plus" (click)="increaseQty()">
        <ion-icon name="add" slot="icon-only"></ion-icon>
      </ion-button>
    </div>
  </ion-item>

  <ion-item>
    <ion-input
      label="Special Note"
      label-placement="floating"
      type="text"
    ></ion-input>
    <ion-button
      class="btnicon"
      slot="end"
      color="primary"
      (click)="openModal()"
    >
      <ion-icon name="create"></ion-icon>
    </ion-button>
  </ion-item>
  <ion-item>
    <ion-input
      label="Price(RM)"
      label-placement="floating"
      [readonly]="true"
      [value]="tableData?.unitPrice1"
      placeholder="Enter text"
    ></ion-input>
  </ion-item>
  <ion-item>
    <ion-input
      label="GST(RM)"
      label-placement="floating"
      [readonly]="true"
      placeholder="Enter text"
    ></ion-input>
  </ion-item>
  <ion-item>
    <ion-input
      label="Total Price"
      label-placement="floating"
      [readonly]="true"
      [value]="tableData?.total | number : '1.2-2'"
      placeholder="Enter text"
    ></ion-input>
  </ion-item>
  <div class="button-group">
    <ion-button color="danger" expand="block">Back</ion-button>
    <ion-button color="success" expand="block" (click)="nextSelect()"
      >Next</ion-button
    >
    <ion-button color="primary" expand="block" (click)="orderlistForm()"
      >OK</ion-button
    >
  </div>
</ion-card-content>
