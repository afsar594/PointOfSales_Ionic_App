 <ion-header>
  <ion-toolbar color="primary">
    <ion-title>Merge Table</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid class="merge-grid">
    <ion-row class="content-row">

      <!-- Left side (tables) -->
      <ion-col size="9" size-md="9" size-sm="12">
        <ion-card class="order-section">
          <ion-card-header>
            <ion-card-title>Order Tables:</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <ion-grid>
              <ion-row>
                <ion-col
                  size="12"
                  size-sm="12"
                  size-md="3"
                  size-xs="6"
                  *ngFor="let table of [1,2,3,4,5,6,7,8,9]"
                >
                  <ion-card class="table-card">
                    <ion-card-content>
                      <p>Pending Orders:</p>
                      <h3>Table {{ table }}</h3>
                    </ion-card-content>
                  </ion-card>
                </ion-col>
              </ion-row>
            </ion-grid>
          </ion-card-content>
        </ion-card>
      </ion-col>

      <!-- Right side (buttons) -->
      <ion-col
        size="3"
        size-md="3"
        size-sm="12"
        class="action-col"
      >
        <div class="action-buttons">
          <ion-button color="secondary" expand="block">Reset</ion-button>
          <ion-button color="primary" expand="block">Merge</ion-button>
          <ion-button color="medium" expand="block">Exit</ion-button>
        </div>
      </ion-col>

    </ion-row>
  </ion-grid>
</ion-content>
