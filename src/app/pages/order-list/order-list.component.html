<ion-header>
  <ion-toolbar class="topbar">
    <ion-title class="center-text">Amira Restaurant</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="solid" color="danger" (click)="closeForm()">
        Close
        <ion-icon slot="end" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-item>
    <ion-label>TABLE: <strong>T-21</strong></ion-label>
    <ion-label position="end">PAX:</ion-label>
    <ion-select interface="popover" [(ngModel)]="pax" placeholder="1">
      <ion-select-option *ngFor="let num of [1, 2, 3, 4, 5, 6]" [value]="num">
        {{ num }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Total Bill</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-item>
        <ion-input
          label="Gross Amount"
          label-placement="floating"
          [readonly]="true"
          [value]="GrossAmount"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="number"
          label="VAT Amount"
          label-placement="floating"
          [(ngModel)]="VatAmount"
          (ionInput)="calculateNetAmount()"
          placeholder="Enter VAT"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          type="number"
          label="Discount"
          label-placement="floating"
          [(ngModel)]="Discount"
          (ionInput)="calculateNetAmount()"
          placeholder="Enter Discount"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Net Amount"
          label-placement="floating"
          [readonly]="true"
          [value]="NetAmount"
        ></ion-input>
      </ion-item>
    </ion-card-content>
  </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-col slot="start">
      <ion-button color="danger" (click)="openBack()">
        <ion-icon name="arrow-back"></ion-icon>
        BACK
      </ion-button>
    </ion-col>
    <ion-col slot="end">
      <ion-button color="success" (click)="save()">
        <ion-icon name="arrow-down"></ion-icon>
        <ion-spinner *ngIf="Isloading"></ion-spinner>
        ORDER
      </ion-button>
    </ion-col>
  </ion-toolbar>
</ion-footer>
